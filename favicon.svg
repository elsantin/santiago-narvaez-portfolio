<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Definir el filtro de glow/halo -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Gradiente sutil para el círculo -->
    <linearGradient id="circleGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Fondo negro -->
  <rect width="100" height="100" fill="#0a0a0a"/>

  <!-- Círculo con gradiente y borde dorado -->
  <circle cx="50" cy="50" r="42"
          fill="url(#circleGradient)"
          stroke="#b8935f"
          stroke-width="2"
          filter="url(#glow)"/>

  <!-- Texto "SN" en dorado tecnológico -->
  <text x="50" y="62"
        font-family="Cormorant Garamond, serif"
        font-size="36"
        font-weight="600"
        fill="#b8935f"
        text-anchor="middle"
        letter-spacing="2"
        filter="url(#glow)">SN</text>
</svg>
